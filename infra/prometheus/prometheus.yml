# Short intervals so faults show up within seconds during a demo.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: demo
    # The `service` label is attached here, so the apps don't need to add it themselves.
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          service: gateway
      - targets: ["checkout:8000"]
        labels:
          service: checkout
      - targets: ["inventory:8000"]
        labels:
          service: inventory

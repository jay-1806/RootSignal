name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:  # same image as docker-compose, to test the Alembic migrations
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rootsignal
          POSTGRES_PASSWORD: rootsignal
          POSTGRES_DB: rootsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootsignal"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q  # mock LLM + SQLite + scripted telemetry: no keys or services needed
      - name: alembic migrations (upgrade, downgrade, upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://rootsignal:rootsignal@localhost:5432/rootsignal
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/demo
    services:
      postgres:  # real Postgres so the connection-pool tests run
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      INVENTORY_TEST_DB_URL: postgresql://inventory:inventory@localhost:5432/inventory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config --quiet
      - name: promtool check (config + alert rules)
        run: >-
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v3.5.0
          check config /etc/prometheus/prometheus.yml
      - name: amtool check (alertmanager config)
        run: >-
          docker run --rm -v "$PWD/infra/alertmanager:/etc/alertmanager:ro"
          --entrypoint amtool prom/alertmanager:v0.28.1
          check-config /etc/alertmanager/alertmanager.yml
      - name: grafana dashboards are valid JSON
        run: for f in infra/grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null; done

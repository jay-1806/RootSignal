# Alembic CLI config. The app also runs migrations automatically on startup (AUTO_MIGRATE).
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe change"
# The database URL comes from DATABASE_URL (see rootsignal/config.py).
[alembic]
script_location = rootsignal/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
